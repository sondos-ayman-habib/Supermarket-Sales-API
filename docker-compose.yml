services:
  api:
    build: .
    image: supermarket-sales-api:latest
    container_name: supermarket-sales-api
    ports:
      - "8000:8000"
    environment:
      DATA_PATH: /app/src/data/SuperMarket Analysis.csv
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
